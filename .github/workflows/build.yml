name: Build

on:
  push:
    paths-ignore:
      - '*.md'
      - '*LICENSE'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  build-linux:
    name: Build Linux (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC x86_64
            runner: ubuntu-24.04
            preset: gcc
            artifact_arch: x86_64
          - name: GCC aarch64
            runner: ubuntu-24.04-arm
            preset: gcc
            artifact_arch: aarch64
          # - name: Clang x86_64
          #   runner: ubuntu-latest
          #   preset: clang
          #   artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang lld openssl libcurl4-openssl-dev \
            zlib1g-dev libglu1-mesa-dev libdbus-1-dev libvulkan-dev libxi-dev libxrandr-dev libasound2-dev \
            libpulse-dev libudev-dev libpng-dev libncurses5-dev libx11-xcb-dev libfreetype-dev \
            libxinerama-dev libxcursor-dev python3-markupsafe libgtk-3-dev libssl-dev \
            libxss-dev libfuse2 libusb-1.0-0-dev libdecor-0-dev libpipewire-0.3-dev libunwind-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Print sccache stats
        run: sccache --show-stats

      - name: Configure CMake
        run: cmake --preset x-linux-ci-${{matrix.preset}}

      - name: Build
        run: cmake --build --preset x-linux-ci-${{matrix.preset}}

      - name: Generate AppImage
        run: ci/build-appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-linux-${{matrix.preset}}-${{matrix.artifact_arch}}
          path: |
            build/install/Dusklight-*.AppImage
            build/install/debug.tar.*

  build-apple:
    name: Build Apple (${{matrix.name}})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppleClang macOS arm64
            platform: macos
            preset: x-macos-ci-arm64
            artifact_name: macos-appleclang-arm64
            arch: arm64
          - name: AppleClang macOS x86_64
            platform: macos
            preset: x-macos-ci-x86_64
            artifact_name: macos-appleclang-x86_64
            arch: x86_64
          - name: AppleClang iOS arm64
            platform: ios
            preset: x-ios-ci
            artifact_name: ios-appleclang-arm64
          # - name: AppleClang tvOS arm64
          #   platform: tvos
          #   preset: x-tvos-ci
          #   artifact_name: tvos-appleclang-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Install Rust iOS target
        if: matrix.platform == 'ios'
        run: |
          rustup toolchain install stable
          rustup target add aarch64-apple-ios

      - name: Install Rust tvOS target
        if: matrix.platform == 'tvos'
        run: |
          rustup toolchain install nightly
          rustup target add --toolchain nightly aarch64-apple-tvos

      - name: Install Rust x86_64 macOS target
        if: endsWith(matrix.preset, 'x86_64')
        run: |
          rustup toolchain install stable
          rustup target add x86_64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}}

      - name: Build
        run: cmake --build --preset ${{matrix.preset}}

      - name: Stage macOS build for universal merge
        if: matrix.platform == 'macos'
        run: |
          set -eu
          mkdir -p build/stage
          cp -R build/install/Dusklight.app build/stage/
          if [ -f build/install/debug.tar.xz ]; then
            cp build/install/debug.tar.xz build/stage/
          fi
          printf '%s' "${DUSK_VERSION}" > build/stage/version.txt

      - name: Upload macOS stage artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal-stage-${{matrix.arch}}
          path: build/stage
          if-no-files-found: error
          retention-days: 1

      - name: Upload artifacts
        if: matrix.platform != 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-${{matrix.artifact_name}}
          path: |
            build/install/Dusklight.app
            build/install/debug.tar.*

  package-macos-universal:
    name: Package macOS universal binary
    needs: build-apple
    runs-on: macos-latest
    steps:
      - name: Download arm64 stage
        uses: actions/download-artifact@v6
        with:
          name: macos-universal-stage-arm64
          path: staged/arm64

      - name: Download x86_64 stage
        uses: actions/download-artifact@v6
        with:
          name: macos-universal-stage-x86_64
          path: staged/x86_64

      - name: Resolve version
        id: version
        run: |
          set -eu
          arm_ver="$(cat staged/arm64/version.txt)"
          x86_ver="$(cat staged/x86_64/version.txt)"
          if [ "$arm_ver" != "$x86_ver" ]; then
            echo "::error::version mismatch between arm64 ($arm_ver) and x86_64 ($x86_ver) stage artifacts"
            exit 1
          fi
          echo "DUSK_VERSION=$arm_ver" >> "$GITHUB_ENV"
          echo "version=$arm_ver" >> "$GITHUB_OUTPUT"

      - name: Merge .app into universal binary
        run: |
          set -eu
          ARM_APP="staged/arm64/Dusklight.app"
          X86_APP="staged/x86_64/Dusklight.app"
          mkdir -p out
          rm -rf "out/Dusklight.app"
          cp -R "$ARM_APP" "out/Dusklight.app"

          # Discover every Mach-O file under the arm64 .app and lipo it with its
          # x86_64 counterpart. This automatically handles Dusklight, optional
          # crashpad_handler, and any bundled dylibs.
          while IFS= read -r arm_file; do
            rel="${arm_file#$ARM_APP/}"
            x86_file="$X86_APP/$rel"
            out_file="out/Dusklight.app/$rel"
            if [ ! -f "$x86_file" ]; then
              echo "::error::Missing x86_64 counterpart for $rel"
              exit 1
            fi
            mkdir -p "$(dirname "$out_file")"
            echo "lipo $rel"
            lipo -create "$arm_file" "$x86_file" -output "$out_file"
          done < <(find "$ARM_APP" -type f -exec sh -c 'file -b "$1" | grep -q "Mach-O" && printf "%s\n" "$1"' _ {} \;)

      - name: Verify universal binary
        run: |
          set -eu
          MAIN_BIN="out/Dusklight.app/Contents/MacOS/Dusklight"
          info="$(lipo -info "$MAIN_BIN")"
          echo "$info"
          echo "$info" | grep -q "arm64"
          echo "$info" | grep -q "x86_64"

      - name: Re-sign universal bundle (ad-hoc)
        run: |
          set -eu
          # lipo invalidates the linker-applied ad-hoc signature; re-sign so
          # macOS (especially Apple Silicon) will load the binary.
          codesign --force --deep --sign - --timestamp=none out/Dusklight.app
          codesign --verify --deep --strict --verbose=2 out/Dusklight.app

      - name: Merge dSYMs into universal debug archive
        run: |
          set -eu
          ARM_TAR="staged/arm64/debug.tar.xz"
          X86_TAR="staged/x86_64/debug.tar.xz"
          if [ ! -f "$ARM_TAR" ] || [ ! -f "$X86_TAR" ]; then
            echo "No per-arch debug.tar.xz found, skipping dSYM merge"
            exit 0
          fi
          mkdir -p dsym/arm64 dsym/x86_64 dsym/universal
          tar -xf "$ARM_TAR" -C dsym/arm64
          tar -xf "$X86_TAR" -C dsym/x86_64
          # Use arm64 dSYM bundles as the base and lipo each DWARF binary inside.
          cp -R dsym/arm64/. dsym/universal/
          while IFS= read -r arm_dwarf; do
            rel="${arm_dwarf#dsym/arm64/}"
            x86_dwarf="dsym/x86_64/$rel"
            out_dwarf="dsym/universal/$rel"
            if [ ! -f "$x86_dwarf" ]; then
              echo "::warning::Missing x86_64 DWARF for $rel; keeping arm64-only"
              continue
            fi
            echo "lipo $rel"
            lipo -create "$arm_dwarf" "$x86_dwarf" -output "$out_dwarf"
          done < <(find dsym/arm64 -type f -path '*.dSYM/Contents/Resources/DWARF/*')
          (cd dsym/universal && tar -cJf "$GITHUB_WORKSPACE/out/debug.tar.xz" .)

      - name: Upload universal artifact
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-macos-appleclang-universal
          path: |
            out/Dusklight.app
            out/debug.tar.*
          if-no-files-found: error

      - name: Delete stage artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            macos-universal-stage-arm64
            macos-universal-stage-x86_64
          failOnError: false

  build-android:
    name: Build Android (${{matrix.name}})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang arm64-v8a
            preset: x-android-ci-arm64
            abi: arm64-v8a
            artifact_arch: arm64
            rust_target: aarch64-linux-android

    env:
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Rust Android target
        run: |
          rustup toolchain install stable
          rustup target add ${{matrix.rust_target}}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}}

      - name: Build native library
        run: cmake --build --preset ${{matrix.preset}} --target dusklight

      - name: Stage stripped JNI library
        run: ANDROID_STAGE_ABIS="${{matrix.abi}}" platforms/android/scripts/stage-jni-libs.sh

      - name: Build APK
        working-directory: platforms/android
        run: ./gradlew :app:assembleRelease --rerun-tasks

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-android-${{matrix.artifact_arch}}
          path: platforms/android/app/build/outputs/apk/release/app-${{matrix.abi}}-release-unsigned.apk

  build-windows:
    name: Build Windows (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x86_64
            runner: windows-latest
            preset: msvc
            msvc_arch: amd64
            vcpkg_arch: x64
            artifact_arch: x86_64
          - name: MSVC arm64
            runner: windows-latest
            preset: arm64-msvc
            msvc_arch: amd64_arm64
            vcpkg_arch: arm64
            artifact_arch: arm64
          # - name: Clang x86_64
          #   runner: windows-latest
          #   preset: clang
          #   msvc_arch: amd64
          #   vcpkg_arch: x64
          #   artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      # msvc-dev-cmd sets VCPKG_ROOT, set it back
      - name: Override VCPKG_ROOT
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install dependencies
        run: |
          choco install ninja
          vcpkg install freetype:${{matrix.vcpkg_arch}}-windows zstd:${{matrix.vcpkg_arch}}-windows

      - name: Configure CMake
        run: cmake --preset x-windows-ci-${{matrix.preset}}

      - name: Build
        run: cmake --build --preset x-windows-ci-${{matrix.preset}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-win32-msvc-${{matrix.artifact_arch}}
          path: |
            build/install/*.exe
            build/install/*.dll
            build/install/res/
            build/install/debug.7z
